<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Font Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;1,400;0,600&display=swap" rel="stylesheet">
  <!-- Style CSS -->
  <link rel="stylesheet" href="./styles/style.css">
  <title>Halaman Login Spesial ✨</title>
</head>

<body class="login-body">
  <div class="login_container">
    <div class="glass-card">
      <div class="emoji-header">💖</div>
      <h2>Hi Sayang! Login dulu yaa</h2>
      <p class="sub-heading">Siapkan dirimu untuk kejutan manis! ✨</p>
      <form id="loginForm" class="login_form">
        <div class="input-group">
          <input type="text" id="username" placeholder="Username (isinya 'user')" required />
        </div>
        <div class="input-group">
          <input type="password" id="password" placeholder="Password (isinya 'user')" required />
        </div>
        <button type="submit" id="loginBtn">Buka Kejutannya! 🎁</button>
      </form>
      <p class="login_description">
        Jangan lupa senyum dulu sebelum masuk! 😊
      </p>
    </div>
  </div>
</body>
<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/gsap.min.js"></script>
<!-- SweetAlert -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!-- Main JS -->
<script type="application/javascript" src="./scripts/index.js"></script>

</html>
